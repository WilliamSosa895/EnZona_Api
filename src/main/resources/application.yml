# =====================================================================
#  EnZona API — configuración. Los secretos SIEMPRE llegan por variables
#  de entorno (ver .env.example); aquí solo hay valores no sensibles.
# =====================================================================
spring:
  application:
    name: enzona-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # El plan gratuito de Aiven admite 20 conexiones: se deja margen para psql y migraciones.
      maximum-pool-size: ${DB_POOL_MAX:8}
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway es la única fuente de verdad del esquema; Hibernate no lo modifica ni lo valida.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Si la base ya se creó con esquema_enzona_v2.sql, se toma como versión 1.
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    # La clave de Resend puede darse como RESEND_API_KEY; solo se usa si MAIL_PASSWORD no está definida (vacía también la anula).
    password: ${MAIL_PASSWORD:${RESEND_API_KEY:}}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      # Con Resend: STARTTLS obligatorio en 587/2587 (la clave nunca viaja en claro) o TLS implícito (MAIL_SSL=true) en 465/2465.
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      # Tiempos de espera en milisegundos: sin ellos una conexión colgada bloquearía el envío para siempre.
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${MAIL_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # Apagado: /actuator/health no depende del proveedor de correo (encendido, cada sonda abre una sesión SMTP).
      enabled: ${MAIL_HEALTH_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

enzona:
  jwt:
    secreto: ${JWT_SECRET}
    emisor: ${JWT_ISSUER:enzona-api}
    expiracion-minutos: ${JWT_EXPIRATION_MINUTES:60}
  boletos:
    secreto-hmac: ${TICKET_HMAC_SECRET}
  curp:
    clave-cifrado: ${CURP_ENCRYPTION_KEY}
    clave-indice: ${CURP_INDEX_KEY}
  ordenes:
    minutos-reserva: ${ORDER_RESERVATION_MINUTES:10}
    maximo-boletos-por-orden: ${ORDER_MAX_TICKETS:10}
  verificacion:
    minutos-vigencia: ${OTP_VALIDITY_MINUTES:10}
    maximo-intentos: ${OTP_MAX_ATTEMPTS:5}
  sesion:
    maximo-intentos: ${LOGIN_MAX_ATTEMPTS:5}
    minutos-bloqueo: ${LOGIN_LOCK_MINUTES:15}
  pasarela:
    proveedor: ${PAYMENT_PROVIDER:sandbox}
    secreto-webhook: ${PAYMENT_WEBHOOK_SECRET}
  notificaciones:
    modo: ${NOTIFICATIONS_MODE:log}
    remitente: ${MAIL_FROM:no-reply@enzona.mx}
  eventos:
    horas-duracion-por-defecto: ${EVENT_DEFAULT_DURATION_HOURS:6}
    radio-maximo-km: ${EVENT_MAX_RADIUS_KM:50}
  admin:
    nombre: ${ADMIN_NAME:Administrador EnZona}
    correo: ${ADMIN_EMAIL:}
    contrasena: ${ADMIN_PASSWORD:}
  cors:
    origenes: ${CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.uv.enzona: INFO

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.uv.enzona: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
